<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Onli wallet execution architecture</title><desc id="desc">A Recipe selects Openfort. The Journey composes Workflows that use a Capability, which owns the private Openfort Adapter. Resources preserve intent and evidence.</desc><rect width="1200" height="550" rx="20" fill="#f5f4ef"/><g font-family="system-ui,sans-serif" fill="#222a25"><text x="60" y="75" font-size="42" font-weight="600">Intent becomes a verified outcome.</text><rect x="60" y="112" width="1080" height="80" rx="8" fill="#e5e9df"/><text x="90" y="165" font-size="36">Recipe selects Openfort · Resources preserve evidence</text><g fill="none" stroke="#265b42" stroke-width="4"><path d="M375 287h35m375 0h35M1000 342v56H240v20"/></g><g fill="#265b42"><path d="m400 277 16 10-16 10m410-10 16 10-16 10M230 413l10 16 10-16"/></g><g fill="#fff" stroke="#d6d9d1" stroke-width="2"><rect x="60" y="232" width="315" height="110" rx="8"/><rect x="430" y="232" width="355" height="110" rx="8"/><rect x="840" y="232" width="300" height="110" rx="8"/><rect x="60" y="429" width="1080" height="76" rx="8"/></g><g font-size="40" font-weight="500"><text x="105" y="300">Journey</text><text x="480" y="300">Workflows</text><text x="875" y="300">Capability</text><text x="105" y="479">Private Adapter → Openfort / Shield</text></g></g></svg>